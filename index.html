<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orçamentos Fácil - Documentos Legais</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f8fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5d6b82;
      --blue: #0b63ce;
      --blue-dark: #084a9a;
      --border: #d9e3f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(100% - 32px, 860px);
      margin: 0 auto;
      padding: 48px 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: clamp(24px, 5vw, 44px);
      box-shadow: 0 10px 28px rgba(23, 32, 51, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      color: var(--blue-dark);
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.15;
    }

    p {
      margin: 0 0 18px;
    }

    .muted {
      color: var(--muted);
    }

    a {
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus {
      color: var(--blue-dark);
      text-decoration: underline;
    }

    .button {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 18px;
      color: #ffffff;
      background: var(--blue);
      border-radius: 6px;
    }

    .button:hover,
    .button:focus {
      color: #ffffff;
      background: var(--blue-dark);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="page-title">
      <h1 id="page-title">Orçamentos Fácil</h1>
      <p class="muted">Documentos legais do aplicativo Orçamentos Fácil.</p>
      <p>
        Este repositório público contém apenas documentos legais do app
        Orçamentos Fácil. Nenhum código-fonte do aplicativo é publicado aqui.
      </p>
      <a class="button" href="privacy-policy.html">Abrir Política de Privacidade</a>
    </section>
  </main>
</body>
</html>
